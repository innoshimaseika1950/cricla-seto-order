<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クリクラ瀬戸 ご注文</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#152a32;background:#eef5f6}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eef5f6}.wrap{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:clamp(22px,7vw,64px) 16px}.card{width:min(720px,100%);background:#fff;border:2px solid #c7d9dc;border-radius:18px;padding:clamp(28px,7vw,58px);box-shadow:0 6px 22px #183a401c}.card.confirmation{padding:clamp(14px,4vw,24px)}h1{font-size:clamp(30px,8vw,56px);line-height:1.25;margin:0 0 18px;font-weight:800}p{font-size:clamp(20px,5vw,30px);line-height:1.6;margin:0 0 24px}.label{display:block;font-size:clamp(23px,6vw,36px);font-weight:800;margin:28px 0 12px}select,button{width:100%;min-height:76px;border-radius:12px;font-size:clamp(24px,6vw,34px);font-weight:700}select{padding:14px 18px;border:2px solid #8ca7ac;background:#fff;color:#152a32}button{margin-top:26px;border:0;padding:16px;background:#159866;color:#fff}button:disabled{background:#a9b8bb}.notice{margin-top:8px;padding:clamp(14px,4vw,22px) 14px;border-radius:12px;background:#e6f7ec;border:3px solid #20a05f;text-align:center;font-size:clamp(16px,4vw,24px);font-weight:700;line-height:1.65;white-space:pre-line}.error{background:#fff0f0;border-color:#d45757;color:#a12424}.notice .urgent{display:block;margin-top:1em;color:#d00000;font-weight:900}.sending[hidden]{display:none}.sending{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:rgba(42,52,56,.62);color:#fff;font-size:clamp(20px,5vw,28px);font-weight:800}
</style>
</head>
<body>
<main class="wrap"><section class="card"><h1>クリクラ瀬戸 ご注文</h1><p id="hello">LINE情報を確認しています。</p><label class="label" for="count">ご注文本数</label><select id="count"></select><button id="send" disabled>注文を送信する</button><div id="message" class="notice" hidden></div></section></main>
<div id="sending" class="sending" hidden>本数を送信中...</div>
<script>
const LIFF_ID="2011827595-vyYxkcUR";
const BACKEND_URL="https://script.google.com/macros/s/AKfycby0tHlsTm7WuhVZKbA2t_wDfqrhsIqjX7WyXi2LIplp_ARz20X1WBhSagOnxhvYraYn/exec";
const countEl=document.getElementById("count");
for(let i=0;i<=30;i++){const option=document.createElement("option");option.value=i;option.textContent=i+"本";countEl.appendChild(option)}
let profile=null;
function show(text,error=false){const message=document.getElementById("message");message.hidden=false;message.innerHTML=text;message.className="notice"+(error?" error":"")}
function showConfirmation(text){document.querySelector("h1").hidden=true;document.getElementById("hello").hidden=true;document.querySelector(".label").hidden=true;countEl.hidden=true;document.getElementById("send").hidden=true;document.querySelector(".card").classList.add("confirmation");show(text)}
async function start(){try{await liff.init({liffId:LIFF_ID});if(!liff.isLoggedIn()){liff.login();return}profile=await liff.getProfile();document.getElementById("hello").textContent=profile.displayName+" 様、本数を選択してください。";document.getElementById("send").disabled=false}catch(error){show("LINE情報を取得できませんでした。LINEから開き直してください。",true)}}
document.getElementById("send").addEventListener("click",async()=>{const bottleCount=Number(countEl.value);const button=document.getElementById("send");const sending=document.getElementById("sending");button.disabled=true;sending.hidden=false;try{await fetch(BACKEND_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({displayName:profile.displayName,userId:profile.userId,bottleCount})});const orderText="クリクラ瀬戸 注文\\nお名前："+profile.displayName+"\\n本数："+bottleCount+"本\\n注文日時："+new Date().toLocaleString("ja-JP");try{await liff.sendMessages([{type:"text",text:orderText}])}catch(chatError){}sending.hidden=true;showConfirmation(bottleCount===0?"ご注文ありがとうございます。\\nまた次回ご注文お待ちしております。":"ご注文ありがとうございます。\\n配達日に"+bottleCount+"本お届けします。\\n当日、空ボトルのご準備をお願いします。\\n\\n<span class='urgent'>※配達日以外の臨時配達をご希望の方はメッセージでお知らせください。</span>")}catch(error){sending.hidden=true;button.disabled=false;show("送信に失敗しました。再度お試しください。",true)}});
start();
</script>
</body>
</html>
