<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クリクラ瀬戸 商品検索</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif; color: #24363a; background: #f4f8f8; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(100% - 32px, 540px); background: #fff; border: 1px solid #d7e4e4; border-radius: 16px; padding: 38px 26px; text-align: center; box-shadow: 0 10px 28px rgba(30, 70, 73, .09); }
    .icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 18px; display: grid; place-items: center; background: #e8f2ef; color: #398264; font-size: 32px; }
    h1 { margin: 0 0 14px; font-size: 24px; letter-spacing: .04em; }
    p { margin: 0; color: #61757a; font-size: 16px; line-height: 1.85; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">⌕</div>
    <h1>商品検索</h1>
    <p>商品検索ページは準備中です。<br>公開まで今しばらくお待ちください。</p>
  </main>
</body>
</html>
