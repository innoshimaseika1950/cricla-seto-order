<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クリクラ瀬戸 テスト注文</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f1f7f7;
      color: #183238;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 32px 26px;
      background: #fff;
      border: 2px solid #c9dcdf;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 12px 30px rgb(31 78 83 / 12%);
    }
    h1 { margin: 0 0 14px; font-size: 25px; }
    p { margin: 0; line-height: 1.8; }
    .tag {
      display: inline-block;
      margin-bottom: 18px;
      padding: 6px 12px;
      border-radius: 999px;
      background: #e9f5ee;
      color: #2e7d55;
      font-size: 14px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">テスト環境</div>
    <h1>クリクラ瀬戸 テスト注文</h1>
    <p>テスト用LIFFを設定中です。<br>この画面では本番の注文は送信されません。</p>
  </main>
</body>
</html>
